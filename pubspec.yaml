name: ai_evolution
description: Room Zero - A sci-fi incremental game about evolving an artificial intelligence.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  desktop_updater: ^1.4.0
  ffi: ^2.2.0
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config/
    - assets/config/rooms/
    - assets/audio/
    - assets/audio/rooms/
